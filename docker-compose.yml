# docker-compose.yml
# Hybrid Recommendation Intelligence Platform — Local Development Services
#
# Usage:
#   docker compose up -d db        # Start database only
#   docker compose up -d           # Start all services
#   docker compose ps              # Check service health
#   docker compose logs db         # View database logs
#   docker compose down            # Stop all services (data persists in volume)
#   docker compose down -v         # DESTRUCTIVE: stop and delete volume (requires approval)
#
# SECURITY:
#   All credentials are sourced from .env — never hardcoded here.
#   PostgreSQL is bound to 127.0.0.1 only — not exposed to the network.
#   The .env file must never be committed to Git.

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: recommendation_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-recommendation_db}
      POSTGRES_USER: ${DB_USER:-recommendation_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bind to localhost only — PostgreSQL is not publicly exposed
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-recommendation_user} -d ${DB_NAME:-recommendation_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# ---------------------------------------------------------------------------
# Named Volumes — data persists across container restarts
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    name: recommendation_postgres_data
